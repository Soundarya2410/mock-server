<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Server - Security Products</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#0f1117;color:#e1e4e8;min-height:100vh}
    .header{background:linear-gradient(135deg,#1a1f36 0%,#0d1025 100%);border-bottom:1px solid #2d3348;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
    .header h1{font-size:20px;font-weight:700;color:#fff}
    .header h1 span{color:#58a6ff}
    .badge{background:#1a7f37;color:#fff;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600}
    .container{display:flex;min-height:calc(100vh - 56px)}
    .sidebar{width:300px;background:#161822;border-right:1px solid #2d3348;overflow-y:auto;display:flex;flex-direction:column}
    .sidebar-search{padding:8px 12px}
    .sidebar-search input{width:100%;padding:8px 12px;background:#1e2235;border:1px solid #2d3348;border-radius:6px;color:#e1e4e8;font-size:13px;outline:none}
    .sidebar-search input:focus{border-color:#58a6ff}
    .service-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px 12px 8px}
    .service-tab{padding:4px 8px;font-size:10px;font-weight:600;border-radius:4px;cursor:pointer;background:#1e2235;color:#8b949e;border:1px solid #2d3348;white-space:nowrap}
    .service-tab.active{background:#1a2d4a;color:#58a6ff;border-color:#58a6ff}
    .service-tab:hover{background:#1a2d4a;color:#58a6ff}
    .fn-list{flex:1;overflow-y:auto}
    .fn-item{padding:8px 12px;cursor:pointer;border-left:3px solid transparent;transition:all .12s;display:flex;align-items:center;gap:6px;font-size:12px}
    .fn-item:hover{background:#1e2235}
    .fn-item.active{background:#1a2332;border-left-color:#58a6ff}
    .fn-item .method{font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;min-width:36px;text-align:center}
    .m-get{background:#1a4731;color:#3fb950}
    .m-post{background:#3b2e1a;color:#d29922}
    .m-put{background:#1a2d4a;color:#58a6ff}
    .m-delete{background:#4a1a1a;color:#f85149}
    .fn-item .name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .fn-item .num{color:#6e7681;min-width:18px;font-size:11px}
    .main{flex:1;padding:20px 24px;overflow-y:auto}
    .panel{background:#161822;border:1px solid #2d3348;border-radius:10px;margin-bottom:16px}
    .panel-header{padding:12px 16px;border-bottom:1px solid #2d3348;display:flex;align-items:center;justify-content:space-between}
    .panel-header h3{font-size:14px;font-weight:600}
    .panel-body{padding:16px}
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:12px;font-weight:500;color:#8b949e;margin-bottom:4px}
    .form-group textarea{width:100%;padding:10px 12px;background:#1e2235;border:1px solid #2d3348;border-radius:6px;color:#e1e4e8;font-family:'Consolas','Monaco',monospace;font-size:12px;resize:vertical;min-height:140px;outline:none}
    .form-group textarea:focus{border-color:#58a6ff}
    .btn{padding:8px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:5px}
    .btn-primary{background:#238636;color:#fff}
    .btn-primary:hover{background:#2ea043}
    .btn-secondary{background:#2d3348;color:#e1e4e8;margin-left:6px}
    .btn-secondary:hover{background:#3d4358}
    .resp{background:#0d1117;border-radius:6px;padding:12px;font-family:'Consolas','Monaco',monospace;font-size:12px;line-height:1.5;max-height:500px;overflow:auto;white-space:pre-wrap;word-break:break-all}
    .status-bar{margin-bottom:10px;padding:6px 10px;border-radius:5px;font-family:'Inter',sans-serif;font-weight:600;font-size:12px}
    .s-ok{background:#1a4731;color:#3fb950}
    .s-err{background:#4a1a1a;color:#f85149}
    .ep-title{font-size:18px;font-weight:700;margin-bottom:2px}
    .ep-api{font-family:'Consolas',monospace;font-size:12px;color:#8b949e;margin-bottom:16px;word-break:break-all}
    .method-badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px;margin-right:6px}
    .info-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
    .chip{font-size:11px;padding:3px 8px;border-radius:4px;background:#1e2235;color:#8b949e}
    ::-webkit-scrollbar{width:6px}
    ::-webkit-scrollbar-track{background:#0f1117}
    ::-webkit-scrollbar-thumb{background:#2d3348;border-radius:3px}
    .empty-state{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;color:#6e7681}
    .empty-state i{font-size:40px;margin-bottom:12px}
  </style>
</head>
<body>
  <div class="header">
    <h1><i class="bi bi-shield-check"></i> Mock <span>Server</span> — Security Products</h1>
    <span class="badge" id="total-badge">Loading...</span>
  </div>
  <div class="container">
    <div class="sidebar">
      <div class="sidebar-search"><input type="text" id="search" placeholder="Search functions..." oninput="filterFunctions()"></div>
      <div class="service-tabs" id="service-tabs"></div>
      <div class="fn-list" id="fn-list"></div>
    </div>
    <div class="main" id="main">
      <div class="empty-state">
        <i class="bi bi-arrow-left-circle"></i>
        <p>Select a function from the sidebar to begin</p>
      </div>
    </div>
  </div>
<script>
let DATA = null;
let activeService = null;
let activeFn = null;

async function init() {
  const resp = await fetch('/mock');
  DATA = await resp.json();
  document.getElementById('total-badge').textContent = DATA.totalFunctions + ' Functions';
  renderTabs();
  const firstService = Object.keys(DATA.services)[0];
  selectService(firstService);
}

function renderTabs() {
  const tabs = document.getElementById('service-tabs');
  tabs.innerHTML = Object.entries(DATA.services).map(([key, svc]) =>
    `<div class="service-tab${activeService===key?' active':''}" onclick="selectService('${key}')">${svc.displayName} (${svc.functionCount})</div>`
  ).join('');
}

function selectService(key) {
  activeService = key;
  renderTabs();
  renderFnList();
}

function renderFnList() {
  const svc = DATA.services[activeService];
  const q = (document.getElementById('search').value || '').toLowerCase();
  const list = document.getElementById('fn-list');
  const fns = svc.functions.filter(f => !q || f.name.toLowerCase().includes(q) || f.api.toLowerCase().includes(q));
  list.innerHTML = fns.map(f => {
    const mc = 'm-' + f.method.toLowerCase();
    const ac = activeFn && activeFn.name === f.name ? ' active' : '';
    return `<div class="fn-item${ac}" onclick="selectFn('${f.name}')">
      <span class="num">${f.sno}.</span>
      <span class="method ${mc}">${f.method}</span>
      <span class="name">${f.name}</span>
    </div>`;
  }).join('');
}

function filterFunctions() { renderFnList(); }

function selectFn(name) {
  const svc = DATA.services[activeService];
  activeFn = svc.functions.find(f => f.name === name);
  renderFnList();
  renderMain();
}

async function renderMain() {
  if (!activeFn) return;
  const f = activeFn;
  const mc = 'm-' + f.method.toLowerCase();

  // Fetch full function data (with sample request/response)
  let sampleReq = '{}';
  try {
    const resp = await fetch(`/mock/${activeService}`);
    const data = await resp.json();
    const fn = data.functions.find(x => x.name === f.name);
    if (fn && fn.sampleRequest) {
      sampleReq = JSON.stringify(fn.sampleRequest, null, 2);
    }
  } catch(e) {}

  document.getElementById('main').innerHTML = `
    <div class="ep-title">${f.sno}. ${f.name}</div>
    <div class="ep-api"><span class="method-badge ${mc}">${f.method}</span>${f.api}</div>
    ${f.params.length ? '<div class="info-chips">' + f.params.map(p => `<span class="chip">${p}</span>`).join('') + '</div>' : ''}
    <div class="panel">
      <div class="panel-header"><h3><i class="bi bi-send"></i> Request</h3></div>
      <div class="panel-body">
        <div class="form-group">
          <label>Endpoint</label>
          <input type="text" id="endpoint-url" value="/mock/${activeService}/${f.name}" readonly style="width:100%;padding:8px 10px;background:#1e2235;border:1px solid #2d3348;border-radius:6px;color:#58a6ff;font-family:Consolas,monospace;font-size:12px;outline:none">
        </div>
        <div class="form-group">
          <label>Request Body (JSON)</label>
          <textarea id="req-body">${sampleReq}</textarea>
        </div>
        <button class="btn btn-primary" onclick="sendRequest()"><i class="bi bi-play-fill"></i> Send</button>
        <button class="btn btn-secondary" onclick="renderMain()"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><h3><i class="bi bi-reply"></i> Response</h3><span id="resp-time" style="font-size:11px;color:#6e7681"></span></div>
      <div class="panel-body">
        <div class="resp" id="resp-output"><span style="color:#6e7681">Response will appear here...</span></div>
      </div>
    </div>`;
}

async function sendRequest() {
  const url = document.getElementById('endpoint-url').value;
  const bodyText = document.getElementById('req-body').value;
  const start = performance.now();
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: bodyText
    });
    const elapsed = Math.round(performance.now() - start);
    const data = await resp.json();
    document.getElementById('resp-time').textContent = elapsed + 'ms | HTTP ' + resp.status;
    const cls = resp.ok ? 's-ok' : 's-err';
    const label = resp.ok ? 'SUCCESS' : 'ERROR';
    document.getElementById('resp-output').innerHTML =
      `<div class="status-bar ${cls}">${label} — HTTP ${resp.status}</div>` + hl(JSON.stringify(data, null, 2));
  } catch(e) {
    document.getElementById('resp-output').innerHTML =
      `<div class="status-bar s-err">REQUEST FAILED</div><span style="color:#f85149">${e.message}</span>`;
  }
}

function hl(json) {
  json = json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return json.replace(/("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, m => {
    let c = 'color:#d29922';
    if (/^"/.test(m)) { c = /:$/.test(m) ? 'color:#58a6ff' : 'color:#3fb950'; }
    else if (/true|false/.test(m)) c = 'color:#d29922';
    else if (/null/.test(m)) c = 'color:#f85149';
    return '<span style="'+c+'">'+m+'</span>';
  });
}

init();
</script>
</body>
</html>
